[package]
name = "best-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "The command line for every BEST service: sign in by the device flow, read the catalogues, run queries, send commands, follow events"
repository = "https://github.com/behavioralstate/best-cli"
homepage = "https://behavioralstate.io"
readme = "README.md"
keywords = ["best", "cli", "cloudevents", "agents"]
categories = ["command-line-utilities"]

[[bin]]
name = "best"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
dirs = "7"
futures-util = "0.3"
jiff = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "stream", "charset", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
